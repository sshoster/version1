name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Integration tests use Testcontainers against the runner's Docker daemon.
      - run: ./gradlew :backend:build
      # Software bill of materials (Syft → CycloneDX JSON, uploaded as an artifact)
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Dependency vulnerability scan (informational — does not fail the build)
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test -- --watch=false
      - run: npm run build
