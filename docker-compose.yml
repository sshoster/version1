services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # Idempotent replica-set init: the healthcheck initiates rs0 on first run and
    # just reports OK afterwards (transactions require a replica set).
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Full-stack mode: docker compose --profile app up --build
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["app"]
    environment:
      # Explicit profile restores fail-closed startup: JWT_SECRET becomes mandatory.
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: mongodb://mongodb:27017/debate?replicaSet=rs0&directConnection=true
      # Required by the backend at startup — set them in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8081
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      # Optional email invitations (see .env.example)
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # File storage: local volume by default; set STORAGE_PROVIDER=s3 + S3_* for object storage.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      FILE_STORAGE_PATH: /app/data/uploads
      S3_BUCKET: ${S3_BUCKET:-debate-files}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  # Optional local S3-compatible storage for testing the s3 provider:
  #   docker compose --profile s3 up -d minio
  #   then in .env: STORAGE_PROVIDER=s3, S3_ENDPOINT=http://localhost:9000,
  #   S3_ACCESS_KEY=minioadmin, S3_SECRET_KEY=minioadmin (create the bucket in the console).
  minio:
    image: minio/minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  frontend:
    build:
      context: frontend
    profiles: ["app"]
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
  minio-data:
