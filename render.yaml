# Render blueprint (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard - New - Blueprint - pick this repo.
#
# SECRETS ARE NEVER COMMITTED: every "sync: false" entry is a placeholder - Render prompts for
# the value in the dashboard on first deploy (tip: the Environment tab has "Add from .env" for
# bulk paste from your local .env). Everything else is a safe, non-credential value.
services:
  - type: web
    name: bridge-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.fullstack
    dockerContext: .
    plan: free # switch to "starter" for an always-on instance (free sleeps after idle)
    healthCheckPath: /actuator/health
    envVars:
      # --- Core ---
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      # Google OAuth client ID for "Sign in with Google" (public identifier, not a secret).
      # Create at console.cloud.google.com/apis/credentials; add the app URL to Authorized
      # JavaScript origins. Leave empty to hide the Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false # PLACEHOLDER - e.g. 1234567890-abc.apps.googleusercontent.com
      # Comma-separated emails allowed into the super-admin dashboard (/admin); empty disables it.
      - key: SUPER_ADMIN_EMAILS
        sync: false # PLACEHOLDER - e.g. you@example.com
      - key: APP_ENCRYPTION_KEY
        sync: false # PLACEHOLDER - base64 of 32 random bytes: openssl rand -base64 32
      - key: MONGODB_URI
        sync: false # PLACEHOLDER - mongodb+srv://sshoster_db_user:<PASSWORD>@cluster0.gl1a4bh.mongodb.net/debate?retryWrites=true&w=majority
      - key: APP_BASE_URL
        value: https://bridge-ai-fuev.onrender.com # update if the service gets a different URL/domain
      - key: CORS_ALLOWED_ORIGINS
        # First origin: the web app (keep in sync with APP_BASE_URL).
        # https://localhost is the Capacitor native app (Android/iOS WebView origin).
        value: https://bridge-ai-fuev.onrender.com,https://localhost

      # --- Files: Cloudflare R2 (S3-compatible) ---
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        value: bridge-ai-files
      - key: S3_ENDPOINT
        value: https://8f41bee4ee59b3f432594ee5dd44dec8.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY
        sync: false # PLACEHOLDER - R2 API token Access Key ID
      - key: S3_SECRET_KEY
        sync: false # PLACEHOLDER - R2 API token Secret Access Key

      # --- AI ---
      - key: LLM_PROVIDER
        value: openai # set to "fake" to run without an API key / AI costs
      - key: OPENAI_API_KEY
        sync: false # PLACEHOLDER - sk-...
      - key: OPENAI_MODEL
        value: gpt-5.6-luna

      # --- Email invitations ---
      # Render blocks outbound SMTP, so production sends over HTTPS via Brevo
      # (free tier; verify the MAIL_FROM address in Brevo → Senders & Domains).
      - key: MAIL_ENABLED
        value: "true"
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false # PLACEHOLDER - xkeysib-... from Brevo → SMTP & API → API Keys
      - key: MAIL_FROM
        value: sshoster@gmail.com

      # --- Negotiation budgets (defaults; tune if needed) ---
      - key: NEGOTIATION_MAX_TURNS
        value: "10"
      - key: NEGOTIATION_MAX_TOKENS
        value: "20000"
      - key: NEGOTIATION_MAX_SECONDS
        value: "180"

      # --- Safety toggles ---
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: SEED_DEMO
        value: "false" # demo users are for local development only
